<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Python Tutor AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   TOKENS
   Signature idea: the whole conversation renders as a live Python notebook —
   In[n] / Out[n] execution cells, a kernel-status indicator, and a "Run"
   button — instead of a generic chat-bubble stack.
   ========================================================================== */
:root{
  --bg:#101114;
  --bg-glow-a: rgba(91,141,239,0.10);
  --bg-glow-b: rgba(243,118,38,0.06);
  --panel: rgba(20,21,25,0.78);
  --surface: rgba(255,255,255,0.03);
  --surface-hover: rgba(255,255,255,0.06);
  --border: rgba(255,255,255,0.08);
  --border-strong: rgba(255,255,255,0.16);
  --text-primary:#eceef1;
  --text-secondary:#93949e;
  --text-tertiary:#5b5c66;

  --in:#5b8def;
  --in-dim: rgba(91,141,239,0.13);
  --out:#f37626;
  --out-dim: rgba(243,118,38,0.13);

  --success:#3ecf8e;
  --error:#ef5350;

  --code-bg:#0a0b0d;
  --code-border: rgba(255,255,255,0.07);

  --radius-lg:20px;
  --radius-md:13px;
  --radius-sm:8px;

  --font-display:'Manrope', sans-serif;
  --font-body:'Inter', sans-serif;
  --font-mono:'JetBrains Mono', monospace;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

*{ box-sizing:border-box; margin:0; padding:0; }
html,body{ height:100%; }

body{
  font-family:var(--font-body);
  color:var(--text-primary);
  background:
    radial-gradient(760px 460px at 8% -10%, var(--bg-glow-a), transparent 60%),
    radial-gradient(620px 520px at 106% 8%, var(--bg-glow-b), transparent 55%),
    var(--bg);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:26px;
  -webkit-font-smoothing:antialiased;
}

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
}

:focus-visible{ outline:2px solid var(--in); outline-offset:2px; }

/* ==========================================================================
   NOTEBOOK WINDOW
   ========================================================================== */
.notebook{
  width:100%;
  max-width:900px;
  height:min(890px, 92vh);
  background:var(--panel);
  backdrop-filter:blur(22px) saturate(140%);
  -webkit-backdrop-filter:blur(22px) saturate(140%);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  box-shadow:0 30px 80px -22px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.05);
  display:flex;
  flex-direction:column;
  overflow:hidden;
  position:relative;
}

/* --- top bar --- */
.topbar{
  flex:none;
  display:flex;
  align-items:center;
  gap:14px;
  padding:0 18px;
  height:52px;
  border-bottom:1px solid var(--border);
  background:rgba(255,255,255,0.015);
}
.notebook-badge{
  width:26px; height:26px; flex:none;
  border-radius:7px;
  background:linear-gradient(145deg, var(--in), #3a63c9);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-mono); font-weight:700; font-size:12px; color:#eef3ff;
}
.notebook-name{
  font-family:var(--font-mono);
  font-size:13px;
  color:var(--text-secondary);
}
.notebook-name b{ color:var(--text-primary); font-weight:600; }

.topbar-right{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:10px;
}
.kernel-status{
  display:flex; align-items:center; gap:7px;
  font-family:var(--font-mono);
  font-size:12px;
  color:var(--text-secondary);
  padding:5px 10px;
  border:1px solid var(--border);
  border-radius:99px;
  background:var(--surface);
}
.kernel-dot{
  width:7px; height:7px; border-radius:50%;
  background:var(--success);
  box-shadow:0 0 0 3px rgba(62,207,142,0.16);
}
.kernel-status.busy .kernel-dot{
  background:#f4b740;
  box-shadow:0 0 0 3px rgba(244,183,64,0.18);
  animation:pulse 1s ease-in-out infinite;
}
@keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.35;} }

.icon-btn{
  display:flex; align-items:center; gap:6px;
  font-family:var(--font-body);
  font-size:12.5px;
  color:var(--text-secondary);
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:9px;
  padding:6px 11px;
  cursor:pointer;
  transition:all 0.18s var(--ease);
}
.icon-btn:hover{ background:var(--surface-hover); color:var(--text-primary); border-color:var(--border-strong); }
.icon-btn svg{ width:13px; height:13px; }

/* --- header --- */
.header{
  flex:none;
  padding:20px 24px 16px;
  border-bottom:1px solid var(--border);
}
.header h1{
  font-family:var(--font-display);
  font-weight:700;
  font-size:19px;
  letter-spacing:-0.01em;
}
.header p{
  font-size:12.5px;
  color:var(--text-secondary);
  margin-top:3px;
}

/* ==========================================================================
   CELLS AREA
   ========================================================================== */
.cells{
  flex:1 1 auto;
  overflow-y:auto;
  padding:20px 22px 26px;
  display:flex;
  flex-direction:column;
  gap:2px;
  scroll-behavior:smooth;
}
.cells::-webkit-scrollbar{ width:9px; }
.cells::-webkit-scrollbar-track{ background:transparent; }
.cells::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.1); border-radius:99px; border:2px solid transparent; background-clip:padding-box; }
.cells::-webkit-scrollbar-thumb:hover{ background:rgba(255,255,255,0.17); background-clip:padding-box; }

/* --- empty state --- */
.empty-state{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  gap:6px;
  padding:20px;
}
.empty-cellmark{
  font-family:var(--font-mono);
  font-size:12.5px;
  color:var(--out);
  letter-spacing:0.03em;
  margin-bottom:16px;
  opacity:0.9;
}
.empty-state h2{
  font-family:var(--font-display);
  font-weight:800;
  font-size:27px;
  letter-spacing:-0.02em;
  background:linear-gradient(135deg, var(--text-primary), var(--in));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.empty-state .lead{ font-size:14.5px; color:var(--text-secondary); margin-top:9px; max-width:340px; }
.empty-state .sub{ font-size:13px; color:var(--text-tertiary); margin-top:2px; }

.chips{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:9px;
  margin-top:24px;
  max-width:520px;
}
.chip{
  display:flex; align-items:center; gap:7px;
  font-family:var(--font-body);
  font-size:12.5px;
  color:var(--text-secondary);
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:99px;
  padding:8px 14px;
  cursor:pointer;
  transition:all 0.18s var(--ease);
}
.chip:hover{ background:var(--surface-hover); color:var(--text-primary); border-color:var(--in); transform:translateY(-1px); }
.chip svg{ width:11px; height:11px; color:var(--out); flex:none; }

/* --- a single cell (In or Out) --- */
.cell{
  display:flex;
  gap:14px;
  padding:11px 6px;
  border-radius:10px;
  animation:rise 0.32s var(--ease) both;
}
@keyframes rise{ from{ opacity:0; transform:translateY(7px); } to{ opacity:1; transform:translateY(0); } }

.cell-gutter{
  flex:none;
  width:74px;
  text-align:right;
  padding-top:2px;
}
.cell-marker{
  font-family:var(--font-mono);
  font-size:12px;
  font-weight:600;
  white-space:nowrap;
}
.cell.in .cell-marker{ color:var(--in); }
.cell.out .cell-marker{ color:var(--out); }
.cell.out.running .cell-marker{ color:var(--text-tertiary); }
.cell-num{ font-weight:700; }

.cell-body{ flex:1; min-width:0; }

.cell.in .cell-body{
  background:var(--in-dim);
  border:1px solid rgba(91,141,239,0.22);
  border-radius:var(--radius-sm);
  padding:9px 13px;
}
.cell.out .cell-body{
  position:relative;
  border-radius:var(--radius-sm);
  padding:2px 2px 2px 13px;
  border-left:2px solid rgba(243,118,38,0.35);
}

.cell-text{
  font-size:14.5px;
  line-height:1.6;
  color:var(--text-primary);
}
.cell.in .cell-text{ white-space:pre-wrap; word-wrap:break-word; }

.cell-text p{ margin:0 0 9px; }
.cell-text p:last-child{ margin-bottom:0; }
.cell-text ul, .cell-text ol{ margin:0 0 9px 20px; }
.cell-text li{ margin-bottom:3px; }
.cell-text strong{ font-weight:700; color:var(--out); }
.cell-text code.inline{
  font-family:var(--font-mono);
  font-size:0.87em;
  background:rgba(255,255,255,0.08);
  padding:1.5px 6px;
  border-radius:5px;
}

.cell-toolbar{
  position:absolute;
  top:-2px; right:2px;
  display:flex; gap:6px;
  opacity:0;
  transition:opacity 0.15s var(--ease);
}
.cell.out:hover .cell-toolbar{ opacity:1; }
.mini-btn{
  display:flex; align-items:center; gap:5px;
  font-family:var(--font-body);
  font-size:11px;
  color:var(--text-secondary);
  background:rgba(255,255,255,0.05);
  border:1px solid var(--border);
  border-radius:6px;
  padding:4px 8px;
  cursor:pointer;
  transition:all 0.15s var(--ease);
}
.mini-btn:hover{ background:rgba(255,255,255,0.1); color:var(--text-primary); }
.mini-btn.copied{ color:var(--success); border-color:rgba(62,207,142,0.4); }
.mini-btn svg{ width:10px; height:10px; }

/* --- code blocks --- */
.code-block{
  margin:9px 0;
  border-radius:11px;
  overflow:hidden;
  border:1px solid var(--code-border);
  background:var(--code-bg);
}
.code-block-header{
  display:flex; align-items:center; justify-content:space-between;
  padding:7px 12px;
  background:rgba(255,255,255,0.025);
  border-bottom:1px solid var(--code-border);
  font-family:var(--font-mono);
  font-size:11px;
  color:var(--text-tertiary);
}
.copy-btn{
  display:flex; align-items:center; gap:5px;
  font-family:var(--font-body);
  font-size:11px;
  color:var(--text-secondary);
  background:rgba(255,255,255,0.05);
  border:1px solid var(--border);
  border-radius:6px;
  padding:4px 9px;
  cursor:pointer;
  transition:all 0.15s var(--ease);
}
.copy-btn:hover{ background:rgba(255,255,255,0.1); color:var(--text-primary); }
.copy-btn.copied{ color:var(--success); border-color:rgba(62,207,142,0.4); }
.copy-btn svg{ width:11px; height:11px; }

.code-block pre{ margin:0; padding:13px 15px; overflow-x:auto; }
.code-block pre::-webkit-scrollbar{ height:7px; }
.code-block pre::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.12); border-radius:99px; }
.code-block code{
  font-family:var(--font-mono);
  font-size:13px;
  line-height:1.65;
  color:#c9d1d9;
  white-space:pre;
}
.tok-kw{ color:#79a6ff; }
.tok-str{ color:#f3c26e; }
.tok-com{ color:#5b5c66; font-style:italic; }
.tok-num{ color:#c99bf0; }
.tok-fn{ color:#6bd6a8; }

/* --- running / busy cell --- */
.running-indicator{
  display:flex; align-items:center; gap:9px;
  padding:9px 0;
  font-family:var(--font-mono);
  font-size:12.5px;
  color:var(--text-tertiary);
}
.running-dots{ display:flex; gap:4px; }
.running-dots span{
  width:6px; height:6px; border-radius:50%;
  background:var(--out);
  animation:bounce 1.1s ease-in-out infinite;
}
.running-dots span:nth-child(2){ animation-delay:0.15s; }
.running-dots span:nth-child(3){ animation-delay:0.3s; }
@keyframes bounce{ 0%,60%,100%{ transform:translateY(0); opacity:0.45; } 30%{ transform:translateY(-4px); opacity:1; } }
.running-elapsed{ font-variant-numeric:tabular-nums; }

/* ==========================================================================
   TOAST
   ========================================================================== */
.toast{
  position:absolute;
  left:50%; bottom:104px;
  transform:translate(-50%, 10px);
  display:flex; align-items:center; gap:9px;
  background:rgba(32,14,13,0.94);
  border:1px solid rgba(239,83,80,0.35);
  color:#ffd9d6;
  padding:10px 14px;
  border-radius:11px;
  font-size:13px;
  box-shadow:0 12px 30px -10px rgba(0,0,0,0.6);
  opacity:0; pointer-events:none;
  transition:all 0.26s var(--ease);
  z-index:6;
  max-width:88%;
}
.toast.visible{ opacity:1; transform:translate(-50%, 0); pointer-events:auto; }
.toast svg{ width:15px; height:15px; flex:none; color:var(--error); }

/* ==========================================================================
   INPUT CELL
   ========================================================================== */
.input-area{
  flex:none;
  padding:14px 18px calc(16px + env(safe-area-inset-bottom));
  border-top:1px solid var(--border);
  background:rgba(255,255,255,0.012);
}
.input-cell{
  display:flex;
  gap:14px;
}
.input-gutter{
  flex:none; width:74px; text-align:right; padding-top:11px;
  font-family:var(--font-mono); font-size:12px; font-weight:600; color:var(--in);
}
.input-shell{
  flex:1;
  display:flex; align-items:flex-end; gap:8px;
  background:var(--in-dim);
  border:1px solid rgba(91,141,239,0.28);
  border-radius:var(--radius-md);
  padding:7px 7px 7px 13px;
  transition:border-color 0.2s var(--ease), box-shadow 0.2s var(--ease);
}
.input-shell:focus-within{
  border-color:var(--in);
  box-shadow:0 0 0 3px rgba(91,141,239,0.18);
}
#messageInput{
  flex:1;
  background:transparent;
  border:none; outline:none; resize:none;
  color:var(--text-primary);
  font-family:var(--font-body);
  font-size:14.5px;
  line-height:1.55;
  max-height:150px;
  padding:8px 0;
}
#messageInput::placeholder{ color:var(--text-tertiary); }

.run-btn{
  flex:none;
  width:36px; height:36px;
  border-radius:10px;
  border:none;
  cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  background:linear-gradient(145deg, var(--in), #3a63c9);
  color:#eef3ff;
  box-shadow:0 6px 16px -6px rgba(91,141,239,0.55);
  transition:transform 0.15s var(--ease), opacity 0.15s var(--ease), box-shadow 0.15s var(--ease);
}
.run-btn svg{ width:15px; height:15px; margin-left:1px; }
.run-btn:hover:not(:disabled){ transform:translateY(-1px); box-shadow:0 8px 20px -6px rgba(91,141,239,0.75); }
.run-btn:active:not(:disabled){ transform:translateY(0) scale(0.96); }
.run-btn:disabled{ opacity:0.35; cursor:not-allowed; box-shadow:none; background:rgba(255,255,255,0.08); }
.run-btn .spinner{
  width:14px; height:14px; border-radius:50%;
  border:2px solid rgba(255,255,255,0.35);
  border-top-color:#fff;
  animation:spin 0.7s linear infinite;
  display:none;
}
.run-btn.loading .spinner{ display:block; }
.run-btn.loading svg{ display:none; }
@keyframes spin{ to{ transform:rotate(360deg); } }

.hint{
  font-size:11px;
  color:var(--text-tertiary);
  text-align:center;
  margin-top:9px;
  padding-left:74px;
}
.hint kbd{
  font-family:var(--font-mono);
  background:rgba(255,255,255,0.06);
  border:1px solid var(--border);
  border-radius:4px;
  padding:1px 5px;
  font-size:10px;
}

/* ==========================================================================
   RESPONSIVE
   ========================================================================== */
@media (max-width:640px){
  body{ padding:0; }
  .notebook{ max-width:100%; height:100vh; height:100dvh; border-radius:0; border:none; }
  .header{ padding:16px 16px 12px; }
  .cells{ padding:14px 12px 20px; }
  .cell{ gap:8px; }
  .cell-gutter, .input-gutter{ width:44px; }
  .cell-marker{ font-size:10.5px; }
  .hint{ padding-left:44px; }
  .topbar .icon-btn span{ display:none; }
}
</style>
</head>
<body>

<div class="notebook">

  <!-- Top bar -->
  <div class="topbar">
    <div class="notebook-badge">Py</div>
    <div class="notebook-name"><b>Python_Tutor</b>.ipynb</div>
    <div class="topbar-right">
      <div class="kernel-status" id="kernelStatus">
        <span class="kernel-dot"></span>
        <span id="kernelStatusText">Idle</span>
      </div>
      <button class="icon-btn" id="newChatBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
        <span>New chat</span>
      </button>
    </div>
  </div>

  <!-- Header -->
  <div class="header">
    <h1>Python Tutor AI</h1>
    <p>Your personal Python programming assistant</p>
  </div>

  <!-- Cells -->
  <div class="cells" id="cells">
    <div class="empty-state" id="emptyState">
      <div class="empty-cellmark">In&nbsp;[&nbsp;]: import tutor</div>
      <h2>Python Tutor AI</h2>
      <p class="lead">Learn Python. Write better code.</p>
      <p class="sub">Ask me anything about Python.</p>
      <div class="chips" id="chips">
        <button class="chip" data-prompt="Explain Python lists"><svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg>Explain Python lists</button>
        <button class="chip" data-prompt="How do Python functions work?"><svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg>How do Python functions work?</button>
        <button class="chip" data-prompt="Why am I getting this error?"><svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg>Why am I getting this error?</button>
        <button class="chip" data-prompt="Teach me Python loops"><svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg>Teach me Python loops</button>
      </div>
    </div>
  </div>

  <!-- Error toast -->
  <div class="toast" id="errorToast">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    <span id="errorToastText">Something went wrong.</span>
  </div>

  <!-- Input cell -->
  <div class="input-area">
    <div class="input-cell">
      <div class="input-gutter" id="inputGutter">In [<span id="nextCellNum">1</span>]:</div>
      <div class="input-shell">
        <textarea id="messageInput" rows="1" placeholder="Ask a Python question..." aria-label="Message"></textarea>
        <button class="run-btn" id="sendBtn" disabled aria-label="Run">
          <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg>
          <span class="spinner"></span>
        </button>
      </div>
    </div>
    <div class="hint"><kbd>Enter</kbd> to run &nbsp;·&nbsp; <kbd>Shift</kbd>+<kbd>Enter</kbd> for new line</div>
  </div>

</div>

<script>
(function(){
  "use strict";

  const cellsEl     = document.getElementById("cells");
  const emptyState  = document.getElementById("emptyState");
  const input       = document.getElementById("messageInput");
  const sendBtn     = document.getElementById("sendBtn");
  const toast       = document.getElementById("errorToast");
  const toastText   = document.getElementById("errorToastText");
  const newChatBtn  = document.getElementById("newChatBtn");
  const kernelStatus     = document.getElementById("kernelStatus");
  const kernelStatusText = document.getElementById("kernelStatusText");
  const nextCellNumEl    = document.getElementById("nextCellNum");

  let isLoading = false;
  let cellCount = 0;
  let toastTimer = null;

  // ---------------------------------------------------------------------
  // Utilities
  // ---------------------------------------------------------------------

  function escapeHtml(str){
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function scrollToBottom(){
    cellsEl.scrollTop = cellsEl.scrollHeight;
  }

  function showError(message){
    toastText.textContent = message;
    toast.classList.add("visible");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("visible"), 4500);
  }

  function autoGrow(){
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 150) + "px";
  }

  function updateSendState(){
    sendBtn.disabled = isLoading || input.value.trim().length === 0;
  }

  function setKernelBusy(busy){
    kernelStatus.classList.toggle("busy", busy);
    kernelStatusText.textContent = busy ? "Busy" : "Idle";
  }

  // ---------------------------------------------------------------------
  // Tiny safe markdown + Python syntax highlighter (escape first, then
  // only ever insert markup we generate ourselves)
  // ---------------------------------------------------------------------

  const PY_KEYWORDS = ["def","return","if","elif","else","for","while","import","from",
    "class","try","except","finally","with","as","in","is","not","and","or","None",
    "True","False","print","self","lambda","yield","break","continue","pass","raise",
    "global","nonlocal","assert","async","await","del","match","case"];

  function highlightPython(escapedCode){
    const tokens = [];
    function stash(html){ tokens.push(html); return "\u0000" + (tokens.length - 1) + "\u0001"; }

    let code = escapedCode;
    code = code.replace(/#.*/g, m => stash('<span class="tok-com">' + m + '</span>'));
    code = code.replace(/("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')/g,
      m => stash('<span class="tok-str">' + m + '</span>'));
    code = code.replace(/\b(def)(\s+)([A-Za-z_]\w*)/g,
      (m, kw, sp, name) => '<span class="tok-kw">' + kw + '</span>' + sp + '<span class="tok-fn">' + name + '</span>');
    const kwPattern = new RegExp("\\b(" + PY_KEYWORDS.join("|") + ")\\b", "g");
    code = code.replace(kwPattern, m => '<span class="tok-kw">' + m + '</span>');
    code = code.replace(/\b(\d+\.?\d*)\b/g, m => '<span class="tok-num">' + m + '</span>');
    code = code.replace(/\u0000(\d+)\u0001/g, (m, i) => tokens[Number(i)]);
    return code;
  }

  function renderInline(text){
    text = text.replace(/`([^`\n]+)`/g, (m, c) => '<code class="inline">' + c + '</code>');
    text = text.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
    return text;
  }

  function renderTextBlock(text){
    const blocks = text.split(/\n{2,}/);
    return blocks.map(block => {
      const lines = block.split("\n").filter(l => l.length > 0);
      const isUl = lines.length > 0 && lines.every(l => /^[-*]\s+/.test(l));
      const isOl = lines.length > 0 && lines.every(l => /^\d+[.)]\s+/.test(l));
      if (isUl) return "<ul>" + lines.map(l => "<li>" + renderInline(l.replace(/^[-*]\s+/, "")) + "</li>").join("") + "</ul>";
      if (isOl) return "<ol>" + lines.map(l => "<li>" + renderInline(l.replace(/^\d+[.)]\s+/, "")) + "</li>").join("") + "</ol>";
      return "<p>" + renderInline(block).replace(/\n/g, "<br>") + "</p>";
    }).join("");
  }

  function renderMarkdown(raw){
    const escaped = escapeHtml(raw);
    const parts = [];
    let lastIndex = 0;
    const fenceRe = /```(\w+)?\n?([\s\S]*?)```/g;
    let match;

    while ((match = fenceRe.exec(escaped)) !== null){
      if (match.index > lastIndex) parts.push(renderTextBlock(escaped.slice(lastIndex, match.index)));
      const lang = (match[1] || "python").toLowerCase();
      const codeContent = match[2].replace(/\n$/, "");
      const highlighted = (lang === "python" || lang === "py") ? highlightPython(codeContent) : codeContent;
      parts.push(
        '<div class="code-block">' +
          '<div class="code-block-header"><span>' + lang + '</span>' +
            '<button class="copy-btn" type="button">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>' +
              '<span>Copy</span>' +
            '</button>' +
          '</div>' +
          '<pre><code>' + highlighted + '</code></pre>' +
        '</div>'
      );
      lastIndex = fenceRe.lastIndex;
    }
    if (lastIndex < escaped.length) parts.push(renderTextBlock(escaped.slice(lastIndex)));
    return parts.join("");
  }

  // ---------------------------------------------------------------------
  // Cell rendering
  // ---------------------------------------------------------------------

  function addInCell(text, num){
    if (emptyState) emptyState.remove();
    const cell = document.createElement("div");
    cell.className = "cell in";
    cell.innerHTML =
      '<div class="cell-gutter"><span class="cell-marker">In&nbsp;[<span class="cell-num">' + num + '</span>]:</span></div>' +
      '<div class="cell-body"><div class="cell-text"></div></div>';
    cell.querySelector(".cell-text").textContent = text; // plain text, safe by construction
    cellsEl.appendChild(cell);
    scrollToBottom();
  }

  function addRunningOutCell(num){
    const cell = document.createElement("div");
    cell.className = "cell out running";
    cell.id = "runningCell";
    cell.innerHTML =
      '<div class="cell-gutter"><span class="cell-marker">Out[<span class="cell-num">*</span>]:</span></div>' +
      '<div class="cell-body"><div class="running-indicator">' +
        '<div class="running-dots"><span></span><span></span><span></span></div>' +
        '<span>executing</span><span class="running-elapsed" id="runningElapsed">0.0s</span>' +
      '</div></div>';
    cellsEl.appendChild(cell);
    scrollToBottom();

    const start = performance.now();
    const elapsedEl = cell.querySelector("#runningElapsed");
    const timer = setInterval(() => {
      const secs = ((performance.now() - start) / 1000).toFixed(1);
      if (elapsedEl) elapsedEl.textContent = secs + "s";
    }, 100);
    cell._timer = timer;
    return cell;
  }

  function removeRunningOutCell(cell){
    if (!cell) return;
    clearInterval(cell._timer);
    cell.remove();
  }

  function addOutCell(content, num){
    const cell = document.createElement("div");
    cell.className = "cell out";
    cell.innerHTML =
      '<div class="cell-gutter"><span class="cell-marker">Out[<span class="cell-num">' + num + '</span>]:</span></div>' +
      '<div class="cell-body">' +
        '<div class="cell-toolbar">' +
          '<button class="mini-btn copy-response-btn" type="button">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>' +
            '<span>Copy</span>' +
          '</button>' +
        '</div>' +
        '<div class="cell-text"></div>' +
      '</div>';
    cell.querySelector(".cell-text").innerHTML = renderMarkdown(content);
    cell.querySelector(".copy-response-btn").addEventListener("click", function(){
      navigator.clipboard.writeText(content).then(() => {
        const label = this.querySelector("span");
        const original = label.textContent;
        this.classList.add("copied");
        label.textContent = "Copied";
        setTimeout(() => { this.classList.remove("copied"); label.textContent = original; }, 1600);
      }).catch(() => showError("Couldn't copy to clipboard."));
    });
    cellsEl.appendChild(cell);
    scrollToBottom();
  }

  // Copy-code button delegation (for fenced code blocks inside Out cells)
  cellsEl.addEventListener("click", (e) => {
    const btn = e.target.closest(".copy-btn");
    if (!btn) return;
    const code = btn.closest(".code-block").querySelector("code").textContent;
    navigator.clipboard.writeText(code).then(() => {
      const label = btn.querySelector("span");
      const original = label.textContent;
      btn.classList.add("copied");
      label.textContent = "Copied!";
      setTimeout(() => { btn.classList.remove("copied"); label.textContent = original; }, 1600);
    }).catch(() => showError("Couldn't copy to clipboard."));
  });

  // ---------------------------------------------------------------------
  // sendMessage
  // ---------------------------------------------------------------------

  async function sendMessage(overrideText){
    const text = (overrideText !== undefined ? overrideText : input.value).trim();
    if (!text || isLoading) return;

    cellCount += 1;
    const thisCellNum = cellCount;

    addInCell(text, thisCellNum);

    input.value = "";
    autoGrow();
    updateSendState();

    isLoading = true;
    sendBtn.classList.add("loading");
    sendBtn.disabled = true;
    setKernelBusy(true);
    const runningCell = addRunningOutCell(thisCellNum);

    try{
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text })
      });
      const data = await res.json().catch(() => ({}));

      removeRunningOutCell(runningCell);

      if (!res.ok){
        showError(data.error || "The tutor is temporarily unavailable. Please try again.");
      } else {
        addOutCell(data.reply || "", thisCellNum);
      }
    } catch (err){
      removeRunningOutCell(runningCell);
      showError("Network error — check your connection and try again.");
    } finally {
      isLoading = false;
      sendBtn.classList.remove("loading");
      setKernelBusy(false);
      updateSendState();
      nextCellNumEl.textContent = cellCount + 1;
      input.focus();
    }
  }

  // ---------------------------------------------------------------------
  // New chat / restart kernel
  // ---------------------------------------------------------------------

  function startNewChat(){
    if (isLoading) return;
    cellsEl.innerHTML = "";
    cellCount = 0;
    nextCellNumEl.textContent = "1";
    cellsEl.appendChild(emptyState);
    fetch("/reset", { method: "POST" }).catch(() => {});
    input.focus();
  }

  // ---------------------------------------------------------------------
  // Event wiring
  // ---------------------------------------------------------------------

  input.addEventListener("input", () => { autoGrow(); updateSendState(); });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey){
      e.preventDefault();
      sendMessage();
    }
  });

  sendBtn.addEventListener("click", () => sendMessage());
  newChatBtn.addEventListener("click", startNewChat);

  document.getElementById("chips").addEventListener("click", (e) => {
    const chip = e.target.closest(".chip");
    if (chip) sendMessage(chip.dataset.prompt);
  });

  updateSendState();
  input.focus();
})();
</script>
